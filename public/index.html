<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soccer Betting AI</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container">
      <a href="#" class="logo" onclick="event.preventDefault(); navigateTo('matches')">Soccer Betting<span>AI</span></a>
      <nav></nav>
    </div>
  </header>

  <main>
    <div class="container">
      <!-- Home Page -->
      <div id="page-home" class="page active">
        <div class="home-hero">
          <div class="home-content">
            <h1 class="home-headline">AI Insights on<br><span class="home-accent">Soccer</span> Betting</h1>
            <p class="home-desc">Smart analysis of match statistics, historical trends and real-time odds</p>
            <button class="home-cta" onclick="navigateTo('matches')">View Matches &rarr;</button>
          </div>
        </div>
      </div>

      <!-- Matches Page -->
      <div id="page-matches" class="page">
        <div id="date-nav" class="date-nav" style="display:none">
          <button class="date-nav-arrow" id="date-prev">&larr;</button>
          <div class="date-pills" id="date-pills"></div>
          <button class="date-nav-arrow" id="date-next">&rarr;</button>
        </div>

        <div id="league-filter" class="league-filter-bar" style="display:none"></div>

        <div id="events-container">
          <div class="loading">
            <span class="spinner"></span>
            Loading matches...
          </div>
        </div>
      </div>

      <!-- Match Info Page -->
      <div id="page-match" class="page">
        <div id="match-container"></div>
      </div>

    </div>
  </main>

  <script src="/profanity.js"></script>
  <script src="/comments.js"></script>
  <script src="/app.js"></script>
</body>
</html>
